exclude: ^infra/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^design_studio/.*\.py$
      - id: ruff-format
        files: ^design_studio/.*\.py$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^design_studio/scripts/.*\.sh$

  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix design_studio/frontend run lint
        language: system
        pass_filenames: false
        files: ^design_studio/frontend/(src/.*\.(js|jsx)|.*\.mjs|vite\.config\.js|eslint\.config\.js|package(-lock)?\.json)$

      - id: frontend-prettier
        name: frontend prettier
        entry: npm --prefix design_studio/frontend run format
        language: system
        pass_filenames: false
        files: ^design_studio/frontend/(src/.*\.(js|jsx|css)|.*\.mjs|index\.html|vite\.config\.js|eslint\.config\.js|package\.json)$

      - id: cdk-eslint
        name: cdk eslint
        entry: npm --prefix design_studio/cdk run lint
        language: system
        pass_filenames: false
        files: ^design_studio/cdk/((bin|src)/.*\.ts|eslint\.config\.mjs|package(-lock)?\.json|tsconfig\.json)$

      - id: cdk-prettier
        name: cdk prettier
        entry: npm --prefix design_studio/cdk run format
        language: system
        pass_filenames: false
        files: ^design_studio/cdk/((bin|src)/.*\.ts|eslint\.config\.mjs|.*\.json)$

      - id: cdk-typecheck
        name: cdk typecheck
        entry: npm --prefix design_studio/cdk run typecheck
        language: system
        pass_filenames: false
        files: ^design_studio/cdk/((bin|src)/.*\.ts|package(-lock)?\.json|tsconfig\.json)$
